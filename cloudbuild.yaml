steps:
  # Build the Docker image with build arguments
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/attendify-frontend:${COMMIT_SHA}'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/attendify-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_API_URL=${_NEXT_PUBLIC_AUTH_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_USER_API_URL=${_NEXT_PUBLIC_USER_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_API_URL=${_NEXT_PUBLIC_BACKEND_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/attendify-frontend:${COMMIT_SHA}'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/attendify-frontend:${COMMIT_SHA}'
      - '--region'
      - '${_DEPLOY_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_AUTH_API_URL=${_NEXT_PUBLIC_AUTH_API_URL},NEXT_PUBLIC_USER_API_URL=${_NEXT_PUBLIC_USER_API_URL},NEXT_PUBLIC_BACKEND_API_URL=${_NEXT_PUBLIC_BACKEND_API_URL},NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL},NODE_ENV=production'
      - '--set-secrets'
      - 'GOOGLE_APPLICATION_CREDENTIALS_JSON=${_GOOGLE_SECRET_NAME}:latest'

# Store images in Artifact Registry
images:
  - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/attendify-frontend:${COMMIT_SHA}'
  - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/attendify-frontend:latest'

# Substitutions (these will be combined with the ones you add in Cloud Build UI)
substitutions:
  _AR_HOSTNAME: 'asia-southeast1-docker.pkg.dev'
  _AR_PROJECT_ID: ${PROJECT_ID}
  _AR_REPOSITORY: 'cloud-run-source-deploy'
  _DEPLOY_REGION: 'asia-southeast1'
  _SERVICE_NAME: 'attendify-frontend-forked'
  # These will be overridden by the UI variables you add
  _NEXT_PUBLIC_AUTH_API_URL: 'https://attendify-auth-140740306164.asia-southeast1.run.app/api/v1/auth'
  _NEXT_PUBLIC_USER_API_URL: 'https://attendify-auth-140740306164.asia-southeast1.run.app/api/v1/users'
  _NEXT_PUBLIC_BACKEND_API_URL: 'https://attendify-backend-140740306164.asia-southeast1.run.app/api/v1'
  _NEXT_PUBLIC_APP_URL: 'https://attendify-frontend-forked-140740306164.asia-southeast1.run.app'
  _GOOGLE_SECRET_NAME: ''  # The Secret Manager secret id containing the Google credentials. Set this in Cloud Build trigger variables.

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
